<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri Dukaan - Videos & Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #00bcd4;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        video, img {
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }
        .whatsapp-btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #25D366;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Meri Dukaan / Business</h1>
        <p>Yahan meri cheezein aur videos dekhein aur order karne ke liye rabta karein!</p>

        <!-- Yahan aap apni Video laga sakte hain -->
        <h3>Meri Video:</h3>
        <video controls>
            <source src="video.mp4" type="video/mp4">
            Aapka browser video ko support nahi karta.
        </video>

        <!-- Yahan aap apni Photo laga sakte hain -->
        <h3>Meri Photo / Product:</h3>
        <img src="photo.jpg" alt="Product Image">

        <br>
        <!-- Aapka WhatsApp Number yahan set kar diya gaya hai -->
        <a class="whatsapp-btn" href="https://wa.me/923257018443?text=Bhai%20mujhe%20yeh%20cheez%20chahiye%20order%20karni%20hai" target="_blank">
            WhatsApp par Order Karein
        </a>
    </div>

</body>
</html>
